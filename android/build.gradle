// Top-level build file for the Capacitor Android shell.
//
// NOTE: every comment in this file is deliberately ASCII. Gradle reads build scripts
// with the platform default encoding on Windows (GBK on this machine), so UTF-8 Chinese
// comments get mis-decoded -- and a mangled byte pair can even swallow a newline, which
// showed up elsewhere in this project as a bogus "Unexpected token ')'".
//
// Version matrix (pinned, all four move together):
//   AGP 8.6.1 + Gradle 8.11.1 + compileSdk 35 + build-tools 34.0.0
// Why not AGP 8.7+: it hard-requires build-tools 35.0.0, and the only Android SDK
// mirror reachable from this machine (dl.google.com is blocked here) stops at r34.
// See scripts/android/setup-sdk.ps1.

buildscript {
    repositories {
        // google() and mavenCentral() both live on hosts this machine cannot reach
        // reliably. Aliyun mirrors the same artifacts.
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

// Two of the three modules are NOT ours to edit:
//   :capacitor-android                 -> node_modules/@capacitor/android/capacitor
//   :capacitor-cordova-android-plugins -> generated by "cap sync"
// Both carry their own buildscript block that hardcodes AGP 8.7.2 and resolves from
// google()/mavenCentral(). Patching node_modules is not an option (it is reinstalled),
// so the root does it from the outside:
//   1) prepend the Aliyun mirrors to every subproject's buildscript repositories --
//      this block runs while the ROOT is evaluated, i.e. before any subproject script,
//      so ours end up first and the blocked hosts are never consulted;
//   2) force the AGP version down to 8.6.1 on every buildscript classpath, because
//      8.7 would demand build-tools 35.0.0, which is not obtainable from here.
subprojects { sub ->
    sub.buildscript.repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    sub.buildscript.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion '8.6.1'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
